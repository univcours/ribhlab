plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }

def appId = providers.gradleProperty('ADMOB_APP_ID').orElse('ca-app-pub-3940256099942544~3347511713').get()
def bannerId = providers.gradleProperty('ADMOB_BANNER_ID').orElse('ca-app-pub-3940256099942544/6300978111').get()
def interstitialId = providers.gradleProperty('ADMOB_INTERSTITIAL_ID').orElse('ca-app-pub-3940256099942544/1033173712').get()

android {
    namespace 'com.ribhlab.ribhmeasure'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ribhlab.ribhmeasure'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '1.3.6'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [admobAppId: appId]
        buildConfigField 'String', 'ADMOB_BANNER_ID', '"' + bannerId + '"'
        buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', '"' + interstitialId + '"'
        buildConfigField 'boolean', 'DEMO_ADS', String.valueOf(appId.contains('3940256099942544'))
    }
    // Release signing is configured exclusively at build time; never commit a keystore.
    // In CI these environment variables come from the existing RivoScan upload-key secrets.
    signingConfigs {
        ribhMeasureRelease {
            def keyFile = System.getenv('RIBHMEASURE_SIGNING_KEYSTORE')
            def keyPass = System.getenv('RIBHMEASURE_SIGNING_PASSWORD')
            if (keyFile && keyPass) {
                storeFile file(keyFile)
                storePassword keyPass
                keyAlias 'key0'
                keyPassword keyPass
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('RIBHMEASURE_SIGNING_KEYSTORE') && System.getenv('RIBHMEASURE_SIGNING_PASSWORD')) {
                signingConfig signingConfigs.ribhMeasureRelease
            }
        }
    }
    buildFeatures { buildConfig true; compose true }
    kotlinOptions { jvmTarget = "17" }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
    lint { abortOnError true }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.ui:ui:1.9.4'
    implementation 'androidx.compose.foundation:foundation:1.9.4'
    implementation 'com.google.ar:core:1.48.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'com.google.android.gms:play-services-ads:24.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
    testImplementation 'junit:junit:4.13.2'
}
