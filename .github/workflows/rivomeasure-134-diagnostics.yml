name: RivoMeasure 1.3.4 diagnostic replay
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rivomeasure-134-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: RivoMeasure-v1.3.4-RivoScan-key-SIGNED-TEST-ADS
          path: signed-artifacts
          run-id: 45809483748
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Diagnostic UI replay
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene
          script: python3 qa/ribhmeasure/diagnostic.py
      - name: Preserve diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoMeasure-1.3.4-diagnostics
          path: qa-output/
          if-no-files-found: warn
