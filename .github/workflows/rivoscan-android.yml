name: RivoScan Android debug build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/rivoscan/**'
      - '.github/workflows/rivoscan-android.yml'
  push:
    branches: [main, feat/rivoscan-android-beta]
    paths:
      - 'apps/rivoscan/**'
      - '.github/workflows/rivoscan-android.yml'
permissions:
  contents: read
jobs:
  android-debug:
    name: Build Android debug APK (not for Play Store production)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/rivoscan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript source and PDF page selection
        run: npm run check && npm test
      - name: Bundle offline web assets
        run: npm run build
      - name: Generate Android wrapper and synchronize
        run: |
          npx cap add android
          npx cap sync android
      - name: Use AGP 9-compatible ProGuard default
        run: |
          sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" android/app/build.gradle
      - name: Integrate live camera edges and interactive crop editor
        shell: pwsh
        run: ./install-live-scanner.ps1
      - name: Install Android adaptive and themed RivoScan icon
        shell: pwsh
        run: ./apply-rivoscan-branding.ps1
      - name: Verify adaptive launcher and app identity
        run: |
          grep -F 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          grep -F '<adaptive-icon' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -F 'rivoscan_launcher_foreground' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -F 'rivoscan_launcher_monochrome' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -F 'versionCode 10' android/app/build.gradle
      - name: Verify live scanner and persistent Documents storage are registered
        run: |
          test -f android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentsPlugin.java
          grep -F 'registerPlugin(RivoDocumentsPlugin.class)' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          grep -F 'MediaStore.Downloads.EXTERNAL_CONTENT_URI' android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentsPlugin.java
          test -f android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerPlugin.java
          test -f android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'showCameraPicker()' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'getAvailableCameraInfos()' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'CameraSelector.DEFAULT_BACK_CAMERA' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'info.getLensFacing()!=CameraSelector.LENS_FACING_BACK' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'unusableCameraIds' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'freezePreview()' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'getCameraState().observe' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'registerPlugin(RivoLiveScannerPlugin.class)' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          test -f android/app/src/main/java/com/ribhlab/rivoscan/RivoSounds.java
          grep -F 'getSoundSettings' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerPlugin.java
          test -f install-rivoscan-android.cmd
          test -f install-rivoscan-android.ps1
          ! grep -Fq 'SM-S908B' install-rivoscan-android.ps1
          grep -F 'RIVOSCAN_DEVICE_SERIAL' install-rivoscan-android.ps1
          grep -F 'registerPlugin(RivoLiveScannerPlugin.class)' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          grep -F 'RivoLiveScannerActivity' android/app/src/main/AndroidManifest.xml
          grep -F 'androidx.camera:camera-view' android/app/build.gradle
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Inspect final APK for RivoScan identity, launcher and native scanner
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com.ribhlab.rivoscan' versionCode='10' versionName='0.10.0'"
          "$AAPT" dump badging "$APK" | grep '^application-icon-' > /tmp/rivoscan-launcher-badging.txt
          "$AAPT" dump resources "$APK" | grep -E 'rivoscan_launcher_(foreground|background)|ic_launcher' > /tmp/rivoscan-launcher-resources.txt
          cat /tmp/rivoscan-launcher-badging.txt
          cat /tmp/rivoscan-launcher-resources.txt
          unzip -Z -1 "$APK" | grep -E '^classes[0-9]*[.]dex$' > /tmp/rivoscan-dex-list.txt
          while IFS= read -r dex; do unzip -p "$APK" "$dex" | strings; done < /tmp/rivoscan-dex-list.txt > /tmp/rivoscan-dex-strings.txt
          grep -F 'RivoLiveScannerPlugin' /tmp/rivoscan-dex-strings.txt
          grep -F 'RivoLiveScannerActivity' /tmp/rivoscan-dex-strings.txt
          echo "PASS: APK 0.10.0 contains launcher resources and native scanner classes."
      - name: Save APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-debug-APK
          path: apps/rivoscan/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
