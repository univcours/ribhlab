name: RivoScan Android debug build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/rivoscan/**'
      - '.github/workflows/rivoscan-android.yml'
  push:
    branches: [main, feat/rivoscan-android-beta]
    paths:
      - 'apps/rivoscan/**'
      - '.github/workflows/rivoscan-android.yml'
permissions:
  contents: read
jobs:
  android-debug:
    name: Build Android debug APK (not for Play Store production)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/rivoscan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript source and PDF page selection
        run: npm run check && npm test
      - name: Verify installer syntax and strict no-downgrade version guard
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'install-rivoscan-android.ps1', [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-Host
            throw 'Installer contains PowerShell syntax errors.'
          }
          $source = Get-Content 'install-rivoscan-android.ps1' -Raw
          foreach ($guard in @(
            'aapt dump badging',
            'pm path com.ribhlab.rivoscan',
            '$installed.VersionCode -gt $apkVersionCode',
            '$installed.VersionCode -eq $apkVersionCode',
            'RIVOSCAN_REINSTALL_SAME_VERSION',
            'install -r $apk'
          )) {
            if (-not $source.Contains($guard)) {
              throw "Missing anti-downgrade guard: $guard"
            }
          }
      - name: Bundle offline web assets
        run: npm run build
      - name: Generate Android wrapper and synchronize
        run: |
          npx cap add android
          npx cap sync android
      - name: Use AGP 9-compatible ProGuard default
        run: |
          sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" android/app/build.gradle
      - name: Integrate live camera edges and interactive crop editor
        shell: pwsh
        run: ./install-live-scanner.ps1
      - name: Install Android adaptive and themed RivoScan icon
        shell: pwsh
        run: ./apply-rivoscan-branding.ps1
      - name: Verify adaptive launcher and app identity
        run: |
          grep -F 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          grep -F '<adaptive-icon' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -F 'rivoscan_launcher_foreground' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -F 'rivoscan_launcher_monochrome' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          # Capacitor's generated versionCode may be stale; the LAST applied
          # RivoScan Gradle override is the actual source of truth in Android Studio.
          grep -E 'apply from: file' android/app/build.gradle | grep -F 'rivoscan-version.gradle'
          grep -F "apply from: file('../../rivoscan-version.gradle')" android/app/build.gradle
          grep -F 'versionCode=30' rivoscan-version.properties
          grep -F 'rivo-build-version' src/main.js
          grep -F 'version as appVersion' src/main.js
          grep -F 'rivo-library-version' src/main.js
          grep -F 'versionName=0.21.0' rivoscan-version.properties
          grep -F 'android.defaultConfig.versionCode' rivoscan-version.gradle || grep -F 'versionCode rivoCode' rivoscan-version.gradle
      - name: Verify live scanner and persistent Documents storage are registered
        run: |
          test -f android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentsPlugin.java
          grep -F 'registerPlugin(RivoDocumentsPlugin.class)' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          # The extra white bar is Android's native ActionBar, NOT the system status bar.
          grep -F 'android:theme="@style/RivoScanNoActionBar"' android/app/src/main/AndroidManifest.xml
          grep -F 'parent="Theme.AppCompat.DayNight.NoActionBar"' android/app/src/main/res/values/rivoscan_no_actionbar.xml
          grep -F 'import '\''./theme-brand.css'\'';' src/main.js
          grep -F '#04bcf7' src/theme-brand.css
          grep -F '#087dfa' src/theme-brand.css
          grep -F '#2328dd' src/theme-brand.css
          grep -F 'android:statusBarColor">#FFFFFF' android/app/src/main/res/values/rivoscan_no_actionbar.xml
          grep -F 'setAppearanceLightStatusBars(true)' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          grep -F 'nativeActionBar.hide()' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          grep -F 'web.setBackgroundColor(Color.rgb(244, 249, 255))' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          grep -F 'public void shareFiles(PluginCall call)' android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentsPlugin.java
          grep -F 'public void organizeFile(PluginCall call)' android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentsPlugin.java
          grep -F 'makeLongImage' src/library-bulk.js
          grep -F 'makeWordText' src/library-bulk.js
          grep -F 'openScanEditor' src/main.js
          grep -F 'data-hub-action' src/main.js
          grep -F 'openPageManager' src/main.js
          grep -F 'RivoScanPagesManager.java' install-live-scanner.ps1
          test -f android/app/src/main/java/com/ribhlab/rivoscan/RivoScanPagesManager.java
          grep -F 'RivoScanPagesManager.show(this,savedImages,nativeLanguage' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F "format==='xlsx'" src/tool-exports.js
          grep -F 'createOCRWorkbook' src/xlsx-export.js
          grep -F 'data-page-action="save"' src/page-manager.js
          grep -F 'format===' src/tool-exports.js
          grep -F 'manualErase' src/tools-hub.js
          grep -F 'data-edit="eraser"' src/scan-editor.js
          grep -F 'rivo-editor-filters' src/style.css
          grep -F 'intent.putExtra("mode"' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerPlugin.java
          grep -F 'scanMode="ID Card".equals(getIntent()' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'home-quick-search' src/main.js
          grep -F 'rivo-recent-actions' src/main.js
          grep -F 'data-id-card-scan' src/main.js
          grep -F 'rivo-shortcuts' src/style.css
          grep -F 'rivo-dark-ui' src/style.css
          grep -F 'createLibraryBulk' src/main.js
          grep -F 'data-bulk="merge"' src/library-bulk.js
          grep -F 'MediaStore.Files.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)' android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentsPlugin.java
          grep -F 'Environment.DIRECTORY_DOCUMENTS' android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentsPlugin.java
          grep -F 'legacyDownloadsCollection()' android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentsPlugin.java
          grep -F 'ViewCompat.setOnApplyWindowInsetsListener(content' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          grep -F 'StatusBar.setStyle({style:Style.Light})' src/main.js
          test -f android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerPlugin.java
          test -f android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'showCameraPicker()' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'drawLoupe(canvas)' android/app/src/main/java/com/ribhlab/rivoscan/RivoCropEditor.java
          # Native post-capture enhancement must run BEFORE saving a scanned page.
          grep -F "'RivoDocumentEnhancer.java'" install-live-scanner.ps1
          grep -F 'private void showEnhancementPreview()' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'RivoDocumentEnhancer.apply(input,preset)' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'private void autoCleanAndSave()' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'this::autoCleanAndSave' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'autoCleanEnabled?defaultEnhancement:RivoDocumentEnhancer.ORIGINAL' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'batchMode=getIntent().getBooleanExtra("batchDefault"' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'public void printFile(PluginCall call)' android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentsPlugin.java
          grep -F 'PrintManager' android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentsPlugin.java
          grep -F 'out.putExtra("scanMode",scanMode)' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'scannerPreferenceRows()' src/main.js
          grep -F 'async function idCardToPdf(pages)' src/main.js
          grep -F 'saveOriginalScannedImage' android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentsPlugin.java
          grep -F 'private void saveEnhancedPage()' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'static Bitmap apply(Bitmap image,String mode)' android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentEnhancer.java
          grep -F 'Imgproc.createCLAHE' android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentEnhancer.java
          grep -F 'Imgproc.adaptiveThreshold' android/app/src/main/java/com/ribhlab/rivoscan/RivoDocumentEnhancer.java
          grep -F 'cameraScore(CameraInfo info)' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'bestAvailableCamera()' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'translateStatus(language,text)' src/main.js
          grep -F 'getAvailableCameraInfos()' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'CameraSelector.DEFAULT_BACK_CAMERA' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'getBoolean("basic"' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerPlugin.java
          grep -F 'if(basicCameraMode)saveWithoutCrop(bmp)' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'RivoLiveScanner.scan({basic:true,language})' src/main.js
          grep -F 'info.getLensFacing()!=CameraSelector.LENS_FACING_BACK' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'unusableCameraIds' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'freezePreview()' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'getCameraState().observe' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'registerPlugin(RivoLiveScannerPlugin.class)' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          test -f android/app/src/main/java/com/ribhlab/rivoscan/RivoSounds.java
          grep -F 'getSoundSettings' android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerPlugin.java
          test -f install-rivoscan-android.cmd
          test -f install-rivoscan-android.ps1
          ! grep -Fq 'SM-S908B' install-rivoscan-android.ps1
          grep -F 'RIVOSCAN_DEVICE_SERIAL' install-rivoscan-android.ps1
          grep -F 'registerPlugin(RivoLiveScannerPlugin.class)' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          grep -F 'RivoLiveScannerActivity' android/app/src/main/AndroidManifest.xml
          grep -F 'androidx.camera:camera-view' android/app/build.gradle
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Inspect final APK for RivoScan identity, launcher and native scanner
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com.ribhlab.rivoscan' versionCode='30' versionName='0.21.0'"
          "$AAPT" dump badging "$APK" | grep '^application-icon-' > /tmp/rivoscan-launcher-badging.txt
          "$AAPT" dump resources "$APK" | grep -E 'rivoscan_launcher_(foreground|background)|ic_launcher' > /tmp/rivoscan-launcher-resources.txt
          cat /tmp/rivoscan-launcher-badging.txt
          cat /tmp/rivoscan-launcher-resources.txt
          unzip -Z -1 "$APK" | grep -E '^classes[0-9]*[.]dex$' > /tmp/rivoscan-dex-list.txt
          while IFS= read -r dex; do unzip -p "$APK" "$dex" | strings; done < /tmp/rivoscan-dex-list.txt > /tmp/rivoscan-dex-strings.txt
          grep -F 'RivoLiveScannerPlugin' /tmp/rivoscan-dex-strings.txt
          grep -F 'RivoLiveScannerActivity' /tmp/rivoscan-dex-strings.txt
          echo "PASS: APK 0.21.0 contains launcher resources and native scanner classes."
      - name: Save APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-debug-APK
          path: apps/rivoscan/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
