name: RivoScan Android debug build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/rivoscan/**'
      - '.github/workflows/rivoscan-android.yml'
  push:
    branches: [main, feat/rivoscan-android-beta]
    paths:
      - 'apps/rivoscan/**'
      - '.github/workflows/rivoscan-android.yml'
permissions:
  contents: read
jobs:
  android-debug:
    name: Build Android debug APK (not for Play Store production)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/rivoscan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript source and PDF page selection
        run: npm run check && npm test
      - name: Bundle offline web assets
        run: npm run build
      - name: Generate Android wrapper and synchronize
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply RivoScan branded launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d assets/icon.png.b64 > android/app/src/main/res/drawable-nodpi/rivoscan_icon.png
          sed -i 's|@mipmap/ic_launcher_round|@drawable/rivoscan_icon|g; s|@mipmap/ic_launcher|@drawable/rivoscan_icon|g' android/app/src/main/AndroidManifest.xml
      - name: Use AGP 9-compatible ProGuard default
        run: |
          sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" android/app/build.gradle
      - name: Integrate live camera edges and interactive crop editor
        shell: pwsh
        run: ./install-live-scanner.ps1
      - name: Verify live scanner is registered in the Android APK sources
        run: |
          test -f android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerPlugin.java
          test -f android/app/src/main/java/com/ribhlab/rivoscan/RivoLiveScannerActivity.java
          grep -F 'registerPlugin(RivoLiveScannerPlugin.class)' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          grep -F 'RivoLiveScannerActivity' android/app/src/main/AndroidManifest.xml
          grep -F 'androidx.camera:camera-view' android/app/build.gradle
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Save APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-debug-APK
          path: apps/rivoscan/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
