name: RivoScan Android debug build
on:
  workflow_dispatch:
  push:
    branches: [feat/rivoscan-android-beta]
    paths:
      - 'apps/rivoscan/**'
      - '.github/workflows/rivoscan-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/rivoscan/**'
      - '.github/workflows/rivoscan-android.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/rivoscan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate native PowerShell scripts before building Android
        shell: pwsh
        run: |
          foreach($script in @('./apply-rivoscan-branding.ps1','./install-live-scanner.ps1','./setup-rivoscan-play-signing.ps1','./repair-rivoscan-android.ps1','./install-rivoscan-android.ps1','./prepare-rivoscan-production-android-studio.ps1')) {
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Host ("Parse error in {0}:{1}:{2}: {3}" -f $script,$_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Message)
              }
              throw "Invalid PowerShell script: $script"
            }
          }
      - name: Install dependencies and test
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run check:play
          npm test
          npm run build
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" android/app/build.gradle
      - name: Integrate native scanner
        shell: pwsh
        run: ./install-live-scanner.ps1
      - name: Apply RivoScan branding and authoritative version
        shell: pwsh
        run: ./apply-rivoscan-branding.ps1
      - name: Validate version metadata
        run: |
          set -euo pipefail
          grep -Eq '^versionCode=[1-9][0-9]*$' rivoscan-version.properties
          grep -Eq '^versionName=[0-9]+[.][0-9]+[.][0-9]+$' rivoscan-version.properties
          node -e "const fs=require('fs');const p=fs.readFileSync('rivoscan-version.properties','utf8');if(p.match(/^versionName=(.+)$/m)?.[1]!==require('./package.json').version)process.exit(1)"
          grep -F 'rivoscan-version.gradle' android/app/build.gradle
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          sed -i 's/-all[.]zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          ./gradlew assembleDebug --no-daemon
      - name: Validate APK version and package
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          CODE=$(sed -n 's/^versionCode=//p' rivoscan-version.properties | tr -d '\r')
          NAME=$(sed -n 's/^versionName=//p' rivoscan-version.properties | tr -d '\r')
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.ribhlab.rivoscan' versionCode='$CODE' versionName='$NAME'"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-debug-APK
          path: apps/rivoscan/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
