name: RivoTalk alpha08 - preserve verified signed artifacts for Play publisher
on:
  push:
    branches: [build/rivotalk-alpha08-admob-qa-20261127]
    paths: [.github/workflows/rivotalk-alpha08-verified-release.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: rivotalk-alpha08-sealed-qa-artifacts
  cancel-in-progress: false
jobs:
  publish-verified-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN: '46066995016'
      EXPECTED_SOURCE_SHA: '73ba801e900882a8e7c9bd9514d7ac6835de190e'
      EXPECTED_CERT_SHA1: 'E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Verify provenance of successful Alpha08 signing run
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha,event > "$RUNNER_TEMP/verified-run.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          obj=json.loads((Path(os.environ['RUNNER_TEMP'])/'verified-run.json').read_text())
          assert obj['conclusion']=='success', 'Cannot redistribute failed or unverified signing run'
          assert obj['headSha']==os.environ['EXPECTED_SOURCE_SHA'], 'Source run SHA changed'
          print('ALPHA08_SIGNING_SOURCE_RUN_VERIFIED=TRUE')
          PY
      - name: Download only verified Alpha08 signed APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-08
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY"             --name RivoTalk-alpha08-APK-AAB-SIGNED-ISOLATED-QA --dir release-08
          (cd release-08 && sha256sum -c SHA256SUMS.txt)
          test -s release-08/RivoTalk-0.1.0-alpha08-RivoScan-SIGNED.apk
          test -s release-08/RivoTalk-0.1.0-alpha08-RivoScan-SIGNED.aab
      - name: Independently verify exact signed package and certificate
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -r | head -n 1)"
          "$SDKMANAGER" --install 'build-tools;36.0.0'
          APK=release-08/RivoTalk-0.1.0-alpha08-RivoScan-SIGNED.apk
          AAB=release-08/RivoTalk-0.1.0-alpha08-RivoScan-SIGNED.aab
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |             grep -F "package: name='com.ribhlab.rivotalk' versionCode='8' versionName='0.1.0-alpha08'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-certificate.txt"
          grep -Fi "$(echo "$EXPECTED_CERT_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')" "$RUNNER_TEMP/apk-certificate.txt"
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/aab-verified.txt" 2>&1
          grep -F 'jar verified' "$RUNNER_TEMP/aab-verified.txt"
          keytool -printcert -jarfile "$AAB" | grep -F "SHA1: $EXPECTED_CERT_SHA1"
          echo 'Verified latest RivoTalk alpha08 (code 8) signed original-key APK/AAB, NOT uploaded to Play.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish checksum-pinned QA source artifacts without changing Play
        shell: bash
        run: |
          set -euo pipefail
          TAG=rivotalk-alpha08-verified-46066995016
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing verified alpha08 QA tag; do not replace assets'
            exit 0
          fi
          gh release create "$TAG" release-08/*.apk release-08/*.aab release-08/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY" --target "$EXPECTED_SOURCE_SHA" --prerelease             --title 'RivoTalk alpha08 — signed original-key AAB and APK'             --notes 'Version 0.1.0-alpha08, code 8, package com.ribhlab.rivotalk. Built and signed successfully in isolated workflow run 46066995016 from exact commit 73ba801e900882a8e7c9bd9514d7ac6835de190e. Package metadata, APK/AAB SHA256 and original upload-key certificate independently rechecked here. This is a signed candidate, NOT proof of Play Production release. Store screenshots must be captured from this exact application version before listing replacement.'
