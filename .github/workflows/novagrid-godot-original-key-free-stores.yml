name: NovaGrid Godot - original-key APK and AAB for free stores
on:
  workflow_dispatch:
  push:
    branches: [release/novagrid-godot-free-stores-20261117]
    paths: ['.github/workflows/novagrid-godot-original-key-free-stores.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: novagrid-godot-free-stores-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sign-verified-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact Godot release from the verified build
        uses: actions/download-artifact@v4
        with:
          name: novagrid-cosmic-UNSIGNED-not-for-play
          run-id: 44114669447
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: novagrid-godot/build
      - name: Verify release identity before signing
        run: |
          set -euo pipefail
          mkdir -p novagrid-godot/build/reports
          curl --retry 3 -fL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=novagrid-godot/build/NovaGrid-Cosmic-Play-UNSIGNED.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=novagrid-godot/build/NovaGrid-Cosmic-Play-UNSIGNED.aab > novagrid-godot/build/reports/manifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('novagrid-godot/build/reports/manifest.xml').getroot()
          ns='{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package']=='com.novagrid.cosmicpuzzle'
          assert root.attrib[ns+'versionCode']=='2000025'
          assert root.attrib[ns+'versionName']=='1.1.0-cosmic'
          assert root.find('application').get(ns+'debuggable') != 'true'
          print('Exact NovaGrid Godot 1.1.0-cosmic versionCode 2000025 verified')
          PY
      - name: Sign with the existing certificate verified against NovaGrid Play Console
        env:
          NOVAGRID_SIGNING_KEY_BASE64: ${{ secrets.RIVO_UPLOAD_KEYSTORE_BASE64 }}
          NOVAGRID_SIGNING_PASSWORD: ${{ secrets.PASSEKEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, re, subprocess, tempfile, zipfile
          expected = 'B0:EE:AD:24:DA:A5:8C:5D:51:58:78:84:38:42:7B:88:50:5A:A9:D1'
          raw = os.environ.get('NOVAGRID_SIGNING_KEY_BASE64', '')
          if not raw or not os.environ.get('NOVAGRID_SIGNING_PASSWORD'):
              raise SystemExit('Existing NovaGrid signing key/password reference unavailable')
          project = pathlib.Path('novagrid-godot')
          build = project / 'build'
          signed = build / 'NovaGrid-Godot-SIGNED.aab'
          apk = build / 'NovaGrid-Godot-SIGNED.apk'
          bundletool = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bundletool.jar'
          def run(args, capture=False):
              return subprocess.run(args, check=True, text=True,
                                    stdout=subprocess.PIPE if capture else None,
                                    stderr=subprocess.PIPE if capture else None)
          with tempfile.TemporaryDirectory(prefix='novagrid-private-sign-', dir=os.environ['RUNNER_TEMP']) as temp:
              key = pathlib.Path(temp) / 'original-upload-key'
              encoded = ''.join(raw.split())
              if len(encoded) % 4 == 1:
                  raise SystemExit('Stored original key has incomplete Base64; no signing performed')
              encoded += '=' * (-len(encoded) % 4)
              try:
                  decoded = base64.b64decode(encoded, validate=True)
              except ValueError:
                  raise SystemExit('Stored original key is not valid Base64; no signing performed')
              if len(decoded) < 500 or decoded[0] != 0x30:
                  raise SystemExit('Stored original key is not a complete PKCS12 keystore; no signing performed')
              key.write_bytes(decoded)
              key.chmod(0o600)
              password_file = pathlib.Path(temp) / 'signing-password'
              password_file.write_text(os.environ['NOVAGRID_SIGNING_PASSWORD'])
              password_file.chmod(0o600)
              info = run(['keytool', '-J-Duser.language=en', '-list', '-v',
                          '-keystore', str(key), '-storepass:env', 'NOVAGRID_SIGNING_PASSWORD'], True).stdout
              aliases = []
              for block in info.split('Alias name: ')[1:]:
                  alias = block.splitlines()[0].strip()
                  match = re.search(r'SHA1:\s*([A-Fa-f0-9:]+)', block)
                  if 'PrivateKeyEntry' in block and match and match.group(1).upper() == expected:
                      aliases.append(alias)
              if len(aliases) != 1:
                  raise SystemExit('Refusing signing: existing key does not uniquely match NovaGrid upload certificate')
              alias = aliases[0]
              run(['jarsigner', '-keystore', str(key), '-storepass:env', 'NOVAGRID_SIGNING_PASSWORD',
                   '-keypass:env', 'NOVAGRID_SIGNING_PASSWORD', '-signedjar', str(signed),
                   str(build / 'NovaGrid-Cosmic-Play-UNSIGNED.aab'), alias])
              verification = run(['jarsigner', '-verify', str(signed)], True).stdout
              if 'jar verified.' not in verification:
                  raise SystemExit('AAB signature verification failed')
              run(['java', '-jar', str(bundletool), 'validate', '--bundle=' + str(signed)])
              archive = pathlib.Path(temp) / 'signed.apks'
              run(['java', '-jar', str(bundletool), 'build-apks', '--bundle=' + str(signed),
                   '--output=' + str(archive), '--mode=universal', '--ks=' + str(key),
                   '--ks-key-alias=' + alias, '--ks-pass=file:' + str(password_file),
                   '--key-pass=file:' + str(password_file)])
              with zipfile.ZipFile(archive) as z:
                  apk.write_bytes(z.read('universal.apk'))
              candidates = sorted((pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools').glob('*/apksigner'))
              if not candidates:
                  raise SystemExit('Android apksigner unavailable')
              cert = run([str(candidates[-1]), 'verify', '--print-certs', str(apk)], True).stdout
              sha1 = re.search(r'Signer #1 certificate SHA-1 digest:\s*([a-fA-F0-9]+)', cert)
              if not sha1 or sha1.group(1).upper() != expected.replace(':', ''):
                  raise SystemExit('APK signer certificate mismatch')
              lines = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name for p in (signed, apk)]
              (build / 'reports' / 'signed-sha256.txt').write_text('\n'.join(lines) + '\n')
              print('NOVAGRID_ORIGINAL_CERTIFICATE_MATCH=' + expected)
              print('NOVAGRID_AAB_SIGNATURE_VERIFIED=true')
              print('NOVAGRID_APK_SIGNATURE_VERIFIED=true')
              print('\n'.join(lines))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('NOVAGRID_SIGNED_AAB=true\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### NovaGrid Godot signed for alternative stores\n')
              summary.write('- Exact source: univcours/app@82241206466672fb53b9d81b5f1f7cb23dd32fe0.\n')
              summary.write('- Existing original NovaGrid upload certificate matched Play Console before signing.\n')
              summary.write('- Both release AAB and universal APK signatures verified; no Play rollout.\n')
          PY
      - name: Preserve verified signed release only
        uses: actions/upload-artifact@v4
        with:
          name: NovaGrid-Godot-original-key-APK-AAB
          path: |
            novagrid-godot/build/NovaGrid-Godot-SIGNED.aab
            novagrid-godot/build/NovaGrid-Godot-SIGNED.apk
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaGrid-Godot-original-key-verification
          path: novagrid-godot/build/reports/
          if-no-files-found: warn
          retention-days: 14
