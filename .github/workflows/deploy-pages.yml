name: Publish RibhLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Scheduled market-feed publishing is paused during Blogger migration.
  # Keep manual dispatch and pushes to preserve the old site as an image/URL archive.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh news headlines from attributed RSS sources
        run: node src/update-news.mjs
      - name: Build pages (Arabic, English, French)
        # Original repository uses the existing /ribhlab-site path.
        # If imported into univcours/univcours.github.io, publish at the account root.
        # A real custom domain may still override with RIBHLAB_SITE_URL only after verification.
        env:
          SITE_URL: ${{ vars.RIBHLAB_SITE_URL || (github.repository == 'univcours/univcours.github.io' && 'https://univcours.github.io' || 'https://univcours.github.io/ribhlab-site') }}
          CONTACT_EMAIL: ${{ vars.RIBHLAB_CONTACT_EMAIL || '' }}
          ADSENSE_PUBLISHER_ID: ${{ vars.RIBHLAB_ADSENSE_PUBLISHER_ID || '' }}
          ENABLE_ADSENSE: ${{ vars.RIBHLAB_ENABLE_ADSENSE || 'false' }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.RIBHLAB_GOOGLE_SITE_VERIFICATION || '' }}
        run: |
          npm run build
          npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
