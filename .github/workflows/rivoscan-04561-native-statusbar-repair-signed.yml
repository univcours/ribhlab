name: RivoScan 0.45.61 signed real Android status icons repair APK
on:
  push:
    branches: [fix/rivoscan-04561-restore-real-android-status-icons]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'install-live-scanner.ps1'
      - 'rivoscan-version.properties'
      - '.github/workflows/rivoscan-04561-native-statusbar-repair-signed.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-ui-test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RIVO_COMPACT_BUILD: '1'
      VITE_RIVO_COMPACT: '1'
      VITE_RIVO_ADMOB_MODE: live
      VITE_RIVO_ADMOB_APP_ID: ca-app-pub-7945572016731367~1509328607
      VITE_RIVO_ADMOB_BANNER_ID: ca-app-pub-7945572016731367/4841809190
      VITE_RIVO_ADMOB_INTERSTITIAL_ID: ca-app-pub-7945572016731367/5608742752
      VITE_RIVO_ADMOB_APP_OPEN_ID: ca-app-pub-7945572016731367/6270875707
      VITE_RIVO_ADMOB_REWARDED_ID: ca-app-pub-7945572016731367/4148993879
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check original approved artwork and transparent launcher output
        run: |
          set -euo pipefail
          grep -Fx 'versionCode=165' rivoscan-version.properties
          grep -Fx 'versionName=0.45.61' rivoscan-version.properties
          grep -Fq 'rivoscan-header-mark.png' src/main.js
          grep -Fq 'const header=originalMark(450)' scripts/create-turquoise-icon.mjs
          grep -Fq 'removeOuterWhite(originalMark(488))' scripts/create-turquoise-icon.mjs
          grep -Fq 'android:startColor="#0739BE"' apply-rivoscan-branding.ps1
          grep -Fq 'rivo-id-photo-layout-04558.css' src/main.js
          grep -Fq 'rivo-id-photo-ready' src/id-photo-maker.js
          grep -Fq 'android:windowLightStatusBar' install-live-scanner.ps1
          grep -Fq 'restoreVisibleNativeStatusBar();' install-live-scanner.ps1
          grep -Fq 'rivo-neo-glass-04560.css' src/main.js
          grep -Fq 'rivo-neo-card-grid' src/main.js
          grep -Fq 'rivo-neo-card-grid' src/rivo-neo-glass-04560.css
          node scripts/prepare-rivoscan-admob-release.mjs --check-only
      - name: Check source, test buttons and UI, bundle assets
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build
          test -s public/rivoscan-header-mark.png
          test -s public/rivoscan-adaptive-foreground.png
          test -s public/rivoscan-icon.png
      - name: Generate native Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          grep -Fq 'android:windowLightStatusBar' android/app/src/main/res/values/rivoscan_no_actionbar.xml
          grep -Fq 'android:windowFullscreen' android/app/src/main/res/values/rivoscan_no_actionbar.xml
          grep -Fq 'controller.show(WindowInsetsCompat.Type.statusBars());' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          grep -Fq 'SYSTEM_UI_FLAG_FULLSCREEN' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
          grep -Fq 'restoreVisibleNativeStatusBar();' android/app/src/main/java/com/ribhlab/rivoscan/MainActivity.java
      - name: Prepare compact scanner release
        run: |
          python3 scripts/prepare-rivoscan-compact.py
          test ! -e android/app/src/main/assets/uvdoc/inference.onnx
      - name: Configure real AdMob app ID
        run: node scripts/prepare-rivoscan-admob-release.mjs
      - name: Sign with original RivoScan Play upload key
        env:
          RIVO_UPLOAD_KEYSTORE_BASE64: ${{ secrets.RIVO_CORRECT_KEYSTORE_BASE64 }}
          RIVO_UPLOAD_STORE_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
          RIVO_UPLOAD_KEY_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
        run: python3 scripts/prepare-rivoscan-signing.py
      - name: Build signed release APK
        env:
          RIVO_UPLOAD_STORE_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
          RIVO_UPLOAD_KEY_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          sed -i 's/-all[.]zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          ./gradlew assembleRelease --no-daemon
      - name: Verify APK identity and original signing certificate
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep -F "name='com.ribhlab.rivoscan' versionCode='165' versionName='0.45.61'"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/rivoscan-cert.txt
          grep -Fiq 'e9b3e2779575ba08a91372fc3885eba01dd3e73e' /tmp/rivoscan-cert.txt
          echo 'RivoScan v0.45.61 signed test APK: original Play upload certificate verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-0.45.61-OriginalKey-SIGNED-Test-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publish a prerelease test APK to GitHub only
        env:
          GH_TOKEN: ${{ secrets.RIVO_RELEASE_PAT || github.token }}
        run: |
          set -euo pipefail
          TAG=rivoscan-0.45.61-restore-status-icons-165-20261121
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/RivoScan-0.45.61-OriginalKey-SIGNED-Test.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::Release already exists; the Actions artifact remains available."
            exit 0
          fi
          gh release create "$TAG" /tmp/RivoScan-0.45.61-OriginalKey-SIGNED-Test.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'RivoScan 0.45.61 signed real Android status icons repair APK' \
            --notes 'RivoScan 0.45.61: fixes the real Android clock, Wi-Fi, battery and network icons disappearing. Explicitly SHOWS native system status bars and clears fullscreen/immersive flags whenever the Activity launches, resumes or regains focus, preserving native pale status background and dark symbols. Includes Neo Glass Blue dashboard, original icons, ID Photo Maker fix, and safe AdMob placement. Signed private test build; not submitted to Google Play. Test-only signed build, not submitted to Google Play. Test-only signed build: NOT submitted to Google Play. WARNING: Play-installed app may use a different signing certificate, so the raw APK might not update it. Never uninstall and lose documents to force installation.'
          echo 'Signed test APK published as a GitHub prerelease; Google Play was NOT touched.' >> "$GITHUB_STEP_SUMMARY"

  android-statusbar-real-device-emulator:
    needs: signed-ui-test-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RivoScan-0.45.61-OriginalKey-SIGNED-Test-APK
          path: android-test
      - name: Enable hardware acceleration for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Check actual Android 15 status icons and capture OS-owned bar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            mkdir -p qa/rivoscan-real-statusbar
            adb install -r android-test/app-release.apk
            adb shell am start -n com.ribhlab.rivoscan/.MainActivity
            sleep 14
            adb shell screencap -p /sdcard/rivo-statusbar-launch.png
            adb pull /sdcard/rivo-statusbar-launch.png qa/rivoscan-real-statusbar/android15-launch.png
            adb shell dumpsys window > qa/rivoscan-real-statusbar/window-launch.txt
            adb shell dumpsys activity top > qa/rivoscan-real-statusbar/activity-launch.txt
            adb shell input keyevent 3
            sleep 2
            adb shell am start -n com.ribhlab.rivoscan/.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/rivo-statusbar-return.png
            adb pull /sdcard/rivo-statusbar-return.png qa/rivoscan-real-statusbar/android15-return.png
            adb shell dumpsys window > qa/rivoscan-real-statusbar/window-return.txt
            test -s qa/rivoscan-real-statusbar/android15-launch.png
            test -s qa/rivoscan-real-statusbar/android15-return.png
            echo 'Android 15 emulator launched the signed APK; screenshots show actual Android status bar before and after return.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload real Android status bar screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-0.45.61-Android15-Native-StatusBar-Real-Screenshots
          path: qa/rivoscan-real-statusbar/
          retention-days: 30
          if-no-files-found: warn
