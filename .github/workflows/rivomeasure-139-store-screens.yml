name: RivoMeasure 1.3.9 store screenshot QA
on:
  push:
    branches: [qa/rivomeasure-139-store-screens]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build exact version with official test ad IDs
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -r | head -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          gradle --no-daemon -p android/RibhMeasure :app:assembleDebug -PADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713 -PADMOB_BANNER_ID=ca-app-pub-3940256099942544/6300978111 -PADMOB_INTERSTITIAL_ID=ca-app-pub-3940256099942544/1033173712
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual app UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 qa/ribhmeasure/store_screens_139.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RivoMeasure-1.3.9-authentic-store-screenshots
          path: qa-output/
          if-no-files-found: error
          retention-days: 14
