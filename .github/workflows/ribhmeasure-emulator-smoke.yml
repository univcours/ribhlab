name: RibhMeasure isolated emulator smoke
on:
  workflow_run:
    workflows: ["Sign RibhMeasure 1.3.0 with original RivoScan upload key"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Signed build run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: RibhMeasure-v1.3.0-RivoScan-key-SIGNED-TEST-ADS
          path: signed-artifacts
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM for isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Signed APK UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 qa/ribhmeasure/smoke.py
      - name: Store actual emulator screenshots and runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RibhMeasure-1.3.0-emulator-evidence
          path: qa-output/
          retention-days: 14
          if-no-files-found: warn
