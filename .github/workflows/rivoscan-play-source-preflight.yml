name: RivoScan source and release safety preflight
on:
  pull_request:
    branches: [feat/rivoscan-android-beta, main]
    paths:
      - 'apps/rivoscan/**'
      - '.github/workflows/rivoscan-play-source-preflight.yml'
  push:
    branches: [feat/rivoscan-android-beta]
    paths:
      - 'apps/rivoscan/**'
      - '.github/workflows/rivoscan-play-source-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/rivoscan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and validate all code
        run: |
          npm install --no-audit --no-fund
          npm run check
          node --check src/plate-scanner.js
          node --check src/barcode-scanner.js
          node --check src/scan-ledger.js
          npm test
      - name: Check authoritative Android version and privacy guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^versionCode=[1-9][0-9]*$' rivoscan-version.properties
          grep -Eq '^versionName=[0-9]+[.][0-9]+[.][0-9]+$' rivoscan-version.properties
          node -e "const fs=require('node:fs');const t=fs.readFileSync('rivoscan-version.properties','utf8');if(t.match(/^versionName=(.+)$/m)?.[1]!==require('./package.json').version)process.exit(1)"
          test -f public/privacy.html
          grep -Fq 'upsertScannerLog' native/android/RivoDocumentsPlugin.java
          grep -Fq 'RivoScan_Plates.xlsx' native/android/RivoDocumentsPlugin.java
          grep -Fq 'RivoScan_Scans.xlsx' native/android/RivoDocumentsPlugin.java
          grep -Fq 'shouldShowInterstitial' src/monetization.js
          grep -Fq 'showPrivacyOptionsForm' src/monetization.js
          test -f tests/live-scanners.test.js
          npm run build
      - name: Validate signing bootstrap PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './setup-rivoscan-play-signing.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
