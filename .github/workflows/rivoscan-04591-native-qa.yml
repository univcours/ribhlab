name: RivoScan 0.45.91 - Genuine Android camera and tool navigation QA
on:
  workflow_dispatch:
  push:
    branches: [fix/rivoscan-04591-single-scan-action]
    paths:
      - .github/workflows/rivoscan-04591-native-qa.yml
      - scripts/qa-04591-native-actions.sh
permissions:
  contents: read
concurrency:
  group: rivoscan-04591-native-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-navigation-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RIVO_SIGNED_APK: ${{ runner.temp }}/rivoscan-04591-apk/RivoScan-0.45.91-UNIVERSAL-SIGNED.apk
      RIVO_NATIVE_QA_DIR: ${{ runner.temp }}/rivo-native-navigation
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify exact signed GitHub pre-release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rivoscan-04591-apk"
          gh release download rivoscan-0.45.91-single-camera --repo "${GITHUB_REPOSITORY}" --pattern 'RivoScan-0.45.91-UNIVERSAL-SIGNED.apk' --dir "${RUNNER_TEMP}/rivoscan-04591-apk"
          test -s "${RIVO_SIGNED_APK}"
          sha256sum "${RIVO_SIGNED_APK}" | tee "${RUNNER_TEMP}/rivoscan-04591-apk/sha256.txt"
      - name: Install screenshot comparison dependency
        run: python3 -m pip install --break-system-packages --disable-pip-version-check --quiet pillow
      - name: Configure Android emulator KVM acceleration
        run: |
          set -euo pipefail
          if test -e /dev/kvm; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod a+rw /dev/kvm
          fi
      - name: Open QR, Plate and central camera using the real signed Android APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/qa-04591-native-actions.sh
      - name: Upload genuine Android screenshots, accessibility trees and comparison metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-0.45.91-ACTUAL-Emulator-Navigation-QA
          path: ${{ runner.temp }}/rivo-native-navigation/
          if-no-files-found: warn
          retention-days: 30
