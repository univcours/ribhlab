name: RivoMeasure 1.3.7 signed QA download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rivomeasure-137-qa-download.yml']
permissions:
  actions: read
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RivoMeasure-v1.3.7-RivoScan-key-SIGNED-TEST-ADS
          run-id: 45856960725
          github-token: ${{ github.token }}
          path: dist
      - name: Publish signed QA APK for local emulator
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK=dist/RivoMeasure-v1.3.7-RivoScan-key-signed.apk
          test -s "$APK"
          (cd dist && sha256sum RivoMeasure-v1.3.7-RivoScan-key-signed.apk > RivoMeasure-v1.3.7-RivoScan-key-signed.apk.sha256)
          gh release create rivomeasure-v1.3.7-qa "$APK" dist/RivoMeasure-v1.3.7-RivoScan-key-signed.apk.sha256 --target bcb998867918bc3b5b6caa538c0c529d03a50071 --prerelease --title "RivoMeasure 1.3.7 QA build" --notes "Test APK signed with existing RivoScan upload key. Automatic room measurement not validated; not a Google Play release."
