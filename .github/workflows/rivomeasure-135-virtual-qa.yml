name: RivoMeasure 1.3.5 virtual scene and regression QA
on:
  workflow_run:
    workflows: ["Sign RivoMeasure 1.3.5 with original RivoScan upload key"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Signed build run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  geometry:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run independent 14-scenario regression
        run: |
          SRC=android/RibhMeasure/app/src/main/java/com/ribhlab/ribhmeasure
          javac -d qa-classes "$SRC"/{RoomMath,AutoRoomMath,WallLoop,RoomMesh,Geometry}.java qa/ribhmeasure/IndependentQa.java
          java -cp qa-classes com.ribhlab.ribhmeasure.IndependentQa
  virtual-scene:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RivoMeasure-v1.3.5-RivoScan-key-SIGNED-TEST-ADS
          path: signed-artifacts
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download official ARCore emulator APK and gRPC client
        run: |
          curl -fL --retry 3 https://github.com/google-ar/arcore-android-sdk/releases/download/1.57.0/Google_Play_Services_for_AR_1.57.0_x86_for_emulator.apk -o arcore-emulator.apk
          python3 -m pip install grpcio
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run signed app in ARCore virtual scene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back virtualscene -grpc 8554
          script: python3 qa/ribhmeasure/virtual_scene.py
      - name: Preserve actual UI and camera test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoMeasure-1.3.5-virtual-scene-evidence
          path: qa-output/
          if-no-files-found: warn
