name: RivoTalk alpha08 - genuine signed-app store screenshots
on:
  push:
    branches: [build/rivotalk-alpha08-admob-qa-20261127]
    paths:
      - 'ci/rivotalk-alpha08-capture.py'
      - '.github/workflows/rivotalk-alpha08-real-store-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rivotalk-08-real-store-photos
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Get exact signed Alpha08 APK, verify package and checked hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-08 store-assets/rivotalk/alpha08
          gh release download rivotalk-alpha08-verified-46066995016             --repo "$GITHUB_REPOSITORY" --dir signed-08
          (cd signed-08 && sha256sum -c SHA256SUMS.txt)
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -r | head -n 1)"
          "$SDKMANAGER" --install 'build-tools;36.0.0'
          APK=signed-08/RivoTalk-0.1.0-alpha08-RivoScan-SIGNED.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |             grep -F "package: name='com.ribhlab.rivotalk' versionCode='8' versionName='0.1.0-alpha08'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          python3 -m py_compile ci/rivotalk-alpha08-capture.py
      - name: Enable actual Android 35 emulator with KVM
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
      - name: Capture unedited screens from installed RivoTalk alpha08
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          disk-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 700
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 1536 -no-metrics
          script: python3 ci/rivotalk-alpha08-capture.py --apk signed-08/RivoTalk-0.1.0-alpha08-RivoScan-SIGNED.apk --output store-assets/rivotalk/alpha08
      - name: Check screenshots are genuine, distinct, actual 1080x1920 Android captures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'Pillow>=11,<13'
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat
          import hashlib
          root=Path('store-assets/rivotalk/alpha08')
          shots=sorted(root.glob('[0-9][0-9]-*.png'))
          assert len(shots)>=2, 'Do not publish stale or fabricated product screenshots'
          digests=set()
          for f in shots:
              assert (root/f.with_suffix('.xml').name).is_file(), 'Missing Android accessibility evidence for '+f.name
              with Image.open(f) as img:
                  assert img.format=='PNG' and img.size==(1080,1920),f.name
                  assert max(ImageStat.Stat(img.convert('RGB').resize((96,160))).stddev)>8,f.name
              d=hashlib.sha256(f.read_bytes()).hexdigest()
              assert d not in digests,'Duplicate screenshots are forbidden'
              digests.add(d)
          print('GENUINE_RIVOTALK_ALPHA08_SCREENSHOTS_VALIDATED='+str(len(shots)))
          PY
          git rev-parse HEAD > store-assets/rivotalk/alpha08/CAPTURE_WORKFLOW_SOURCE_SHA.txt
          echo 'version=0.1.0-alpha08 versionCode=8 originalSigner=e9b3e2779575ba08a91372fc3885eba01dd3e73e'             > store-assets/rivotalk/alpha08/APP_IDENTITY.txt
          (cd store-assets/rivotalk/alpha08 && sha256sum [0-9][0-9]-*.png > SHA256SUMS.txt)
      - name: Preserve genuine Alpha08 screenshot evidence without altering Play listing
        shell: bash
        run: |
          set -euo pipefail
          TAG=rivotalk-alpha08-genuine-screenshots
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Screenshots tag already present; never overwrite verified artwork'
            exit 0
          fi
          gh release create "$TAG" store-assets/rivotalk/alpha08/*.png             store-assets/rivotalk/alpha08/*.xml             store-assets/rivotalk/alpha08/*.txt             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease             --title 'RivoTalk alpha08 — real signed Android screenshots'             --notes 'Captured without alteration from the installed and original-key-signed RivoTalk alpha08 APK (code 8) on genuine Android 35 emulator, 1080x1920. Image/Android accessibility evidence and SHA256 checksums available here. Do NOT replace Google Play listing until matching production app code 8 has been verified.'
