name: RivoCaption 0.4.5 latest private source verified build and original-key signer
on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: The independently verified latest 40-character RivoCaption source SHA
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: rivocaption-045-original-key-signer
  cancel-in-progress: false
jobs:
  build-and-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      RIVO_KEY_B64: ${{ secrets.RIVO_CORRECT_KEYSTORE_BASE64 }}
      RIVO_KEY_PASS: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
      ORIGINAL_SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E
    steps:
      - uses: actions/checkout@v4
      - name: Check out original private RivoCaption source using temporary read-only deploy key
        uses: actions/checkout@v4
        with:
          repository: univcours/RivoCaption
          ref: ${{ inputs.expected_source_commit }}
          path: rivocaption-source
          ssh-key: ${{ secrets.RIVOCAPTION_045_READONLY_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Reject older or wrong app source, preserve Play icon
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git -C rivocaption-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          grep -Fq 'applicationId = "com.rivocaption.editor"' rivocaption-source/app/build.gradle.kts
          grep -Fq 'versionCode = 19' rivocaption-source/app/build.gradle.kts
          grep -Fq 'versionName = "0.4.5"' rivocaption-source/app/build.gradle.kts
          python3 rivocaption-source/tools/qa/check_store_launcher_parity045.py
          grep -Fq 'fun shareRivoCaption' rivocaption-source/app/src/main/java/com/rivocaption/editor/StudioSettingsSheet.kt
          grep -Fq 'rivo_about_title' rivocaption-source/app/src/main/java/com/rivocaption/editor/StudioSettingsSheet.kt
          echo 'PRIVATE_LATEST_SOURCE_AND_ABOUT_SHARE=VERIFIED' >> "$GITHUB_STEP_SUMMARY"
      - name: Install verified Android SDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -r | head -n1)"
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Run lint, unit tests, and build release APK and AAB
        shell: bash
        working-directory: rivocaption-source
        run: |
          set -euo pipefail
          gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk \
            | grep -F "package: name='com.rivocaption.editor' versionCode='19' versionName='0.4.5'"
      - name: Restore original signing key and verify certificate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RIVO_KEY_B64" && test -n "$RIVO_KEY_PASS"
          umask 077
          printf '%s' "$RIVO_KEY_B64" | base64 --decode > "$RUNNER_TEMP/rivocaption-original.p12"
          CERT="$(keytool -list -v -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/rivocaption-original.p12" \
            -storepass:env RIVO_KEY_PASS -alias key0)"
          ACTUAL="$(printf '%s\n' "$CERT" | awk '$1=="SHA1:"{print $2;exit}')"
          test "$ACTUAL" = "$ORIGINAL_SHA1"
      - name: Sign exactly the tested versionCode 19 AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed
          cp rivocaption-source/app/build/outputs/bundle/release/app-release.aab signed/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab
          ORIGINAL_UNSIGNED_SHA256="$(sha256sum signed/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab | cut -d' ' -f1)"
          jarsigner -keystore "$RUNNER_TEMP/rivocaption-original.p12" \
            -storetype PKCS12 -storepass:env RIVO_KEY_PASS -keypass:env RIVO_KEY_PASS \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            signed/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab key0
          jarsigner -verify signed/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab > "$RUNNER_TEMP/verify.txt" 2>&1
          grep -Fq 'jar verified' "$RUNNER_TEMP/verify.txt"
          keytool -printcert -jarfile signed/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab \
            | grep -F "SHA1: $ORIGINAL_SHA1"
          (cd signed && sha256sum RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab > SHA256SUMS.txt)
          printf 'SOURCE_COMMIT=%s\nVERSION_NAME=0.4.5\nVERSION_CODE=19\nPACKAGE=com.rivocaption.editor\nUNSIGNED_AAB_SHA256=%s\n' \
            "$SOURCE_COMMIT" "$ORIGINAL_UNSIGNED_SHA256" > signed/SOURCE-IDENTITY.txt
          echo 'RIVOCAPTION_CODE19_LINT_TEST_RELEASE_BUILD_ORIGINAL_KEY_SIGN=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve signed candidate in release (no Actions artifacts quota used)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rivocaption-v0.4.5-original-key-aab
          name: RivoCaption 0.4.5 code19 original-key signed Play bundle
          prerelease: true
          fail_on_unmatched_files: true
          body: Built from private source in temporary runner; verified lint, unit tests, exact code19 metadata, original signing certificate, and SHA-256. This release is NOT a Google Play Production publication.
          files: |
            signed/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab
            signed/SHA256SUMS.txt
            signed/SOURCE-IDENTITY.txt
      - name: Erase temporary key and private source from runner workspace
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rivocaption-original.p12"
          rm -rf rivocaption-source
