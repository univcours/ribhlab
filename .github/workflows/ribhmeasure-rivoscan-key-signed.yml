             trackingReady=f.getCamera().getTrackingState()==TrackingState.TRACKING; if(autoStart){autoStart=false;autoMode=true;autoAccept=false;autoOrigin=false;autoFloor=Float.NaN;autoHeight=Float.NaN;autoStable=0;autoPolygon=new float[0][];autoLast=0;}if(autoMode&&trackingReady)autoScan(f);project(f); if(add){add=false;autoMode=false;if(!trackingReady){msg(tr("Tracking not ready. Move slowly.","Suivi non prêt.","حرك الهاتف ببطء."));}else place(f);}
