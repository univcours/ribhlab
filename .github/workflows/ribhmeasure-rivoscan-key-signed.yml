name: Sign RibhMeasure 1.2.0 with original RivoScan upload key
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ribhmeasure-rivoscan-key-signed.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ribhmeasure-original-rivoscan-upload-key
  cancel-in-progress: true
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch pinned RibhMeasure source from the RibhLab site repository
        uses: actions/checkout@v4
        with:
          repository: ribhlab/ribhlab.github.io
          ref: 140cc8e89baf0234724f5753a2814820d31b415b
          path: source
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -r | head -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract pinned Android source
        shell: bash
        run: |
          set -euo pipefail
          unzip -q source/public/downloads/RibhMeasure-Android-Source-v1.0.0.zip -d "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/RibhMeasure/app/build.gradle"
          grep -F "applicationId 'com.ribhlab.ribhmeasure'" "$RUNNER_TEMP/RibhMeasure/app/build.gradle"
      - name: Add real AR room measurement and repair API 26 theme
        shell: bash
        run: |
          cd "$RUNNER_TEMP/RibhMeasure"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/res/values/styles.xml')
          p.write_text(p.read_text().replace('        <item name="android:windowLightNavigationBar">false</item>',''))
          p=Path('app/build.gradle')
          p.write_text(p.read_text().replace('dependencies {', "dependencies {\n    implementation 'com.google.ar:core:1.48.0'").replace('versionCode 1','versionCode 3').replace("versionName '1.0.0'","versionName '1.2.0'"))
          p=Path('app/src/main/AndroidManifest.xml')
          t=p.read_text().replace('<uses-permission android:name="android.permission.INTERNET" />','<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />')
          t=t.replace('<activity android:name=".HistoryActivity"', '<meta-data android:name="com.google.ar.core" android:value="optional" />\n        <activity android:name=".RoomArActivity" android:exported="false" />\n        <activity android:name=".HistoryActivity"')
          t=t.replace('<application android:label=', '<queries><intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent></queries>\n    <application android:label=')
          t=t.replace('<activity android:name=".RoomArActivity"','<activity android:name=".RoomManualActivity" android:exported="false" />\n        <activity android:name=".RoomPlanActivity" android:exported="false" />\n        <activity android:name=".RoomProjectsActivity" android:exported="false" />\n        <activity android:name=".RoomArActivity"')
          p.write_text(t)
          p=Path('app/src/main/java/com/ribhlab/ribhmeasure/MainActivity.java')
          t=p.read_text().replace('Ui.gap(this,body,21);','Ui.gap(this,body,21);\n        String lang=java.util.Locale.getDefault().getLanguage(); android.widget.Button ar=Ui.button(this,R.string.app_name,true); ar.setText(lang.equals("ar")?"مسح الغرفة بالكاميرا":lang.equals("fr")?"Scanner une pièce en AR":"Scan room in AR"); ar.setOnClickListener(v->open(RoomArActivity.class)); body.addView(ar,Ui.lp(this,58)); Ui.gap(this,body,8); android.widget.Button manual=Ui.button(this,R.string.app_name,false); manual.setText(lang.equals("ar")?"مخطط بالأبعاد اليدوية":lang.equals("fr")?"Plan par dimensions manuelles":"Room plan — manual dimensions"); manual.setOnClickListener(v->open(RoomManualActivity.class)); body.addView(manual,Ui.lp(this,54)); Ui.gap(this,body,8); android.widget.Button projects=Ui.button(this,R.string.app_name,false); projects.setText(lang.equals("ar")?"مشاريعي":lang.equals("fr")?"Mes projets":"My room projects"); projects.setOnClickListener(v->open(RoomProjectsActivity.class)); body.addView(projects,Ui.lp(this,54)); Ui.gap(this,body,16);')
          p.write_text(t)
          PY
          cat > app/src/main/java/com/ribhlab/ribhmeasure/RoomArActivity.java <<'JAVA'
          package com.ribhlab.ribhmeasure;
          import android.Manifest;
          import android.app.Activity;
