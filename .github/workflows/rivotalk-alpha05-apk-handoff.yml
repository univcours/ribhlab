name: RivoTalk alpha05 signed APK download handoff
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rivotalk-alpha05-apk-handoff.yml'
permissions:
  contents: read
jobs:
  apk:
    if: github.head_ref == 'build/rivotalk-alpha02-original-sign-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download existing original-key signed alpha05 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: univcours/ribhlab
        run: |
          set -euo pipefail
          mkdir -p signed
          gh release download rivotalk-alpha05-build-46042421383 --pattern '*.apk' --pattern SHA256SUMS.txt --dir signed
          test -f signed/RivoTalk-0.1.0-alpha05-RivoScan-SIGNED.apk
          (cd signed && grep '\.apk$' SHA256SUMS.txt | sha256sum -c)
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$SIGNER" verify --print-certs signed/*.apk | grep -Fi 'e9b3e2779575ba08a91372fc3885eba01dd3e73e'
      - name: Attach signed APK for direct ChatGPT handoff
        uses: actions/upload-artifact@v4
        with:
          name: RivoTalk-alpha05-SIGNED-APK
          path: |
            signed/RivoTalk-0.1.0-alpha05-RivoScan-SIGNED.apk
            signed/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
