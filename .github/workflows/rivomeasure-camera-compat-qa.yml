name: RivoMeasure camera compatibility QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rivomeasure-camera-compat-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30, 33]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RivoMeasure-v1.3.5-RivoScan-key-SIGNED-TEST-ADS
          path: signed-artifacts
          run-id: 45833597739
          github-token: ${{ github.token }}
      - name: Official ARCore emulator package
        run: curl -fL --retry 3 https://github.com/google-ar/arcore-android-sdk/releases/download/1.57.0/Google_Play_Services_for_AR_1.57.0_x86_for_emulator.apk -o arcore-emulator.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe camera IDs and actual AR screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back virtualscene -camera-front emulated
          script: python3 qa/ribhmeasure/camera_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-compat-api-${{ matrix.api }}
          path: qa-output/
          if-no-files-found: warn
