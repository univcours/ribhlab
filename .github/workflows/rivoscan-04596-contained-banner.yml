name: RivoScan 0.45.96 - Contained Native Banner Signed Release
on:
  push:
    branches: [release/rivoscan-04596-contained-banner]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rivoscan-04596-contained-banner-lossless-abi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-tester:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RIVO_COMPACT_BUILD: '1'
      VITE_RIVO_COMPACT: '1'
      VITE_RIVO_ADMOB_MODE: live
      VITE_RIVO_ADMOB_APP_ID: ca-app-pub-7945572016731367~1509328607
      VITE_RIVO_ADMOB_BANNER_ID: ca-app-pub-7945572016731367/4841809190
      VITE_RIVO_ADMOB_INTERSTITIAL_ID: ca-app-pub-7945572016731367/5608742752
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate version and real AdMob configuration
        run: |
          set -euo pipefail
          grep -Fx 'versionCode=211' rivoscan-version.properties
          grep -Fx 'versionName=0.45.96' rivoscan-version.properties
          node scripts/prepare-rivoscan-admob-release.mjs --check-only
      - name: Install and run source checks
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build
          grep -RFq 'ca-app-pub-7945572016731367/4841809190' dist/assets --include='*.js'
          if grep -RFq 'ca-app-pub-7945572016731367/4841809191' dist/assets --include='*.js'; then echo 'Wrong banner ID in compiled bundle'; exit 1; fi
      - name: Responsive browser layout QA and real UI screenshots
        env:
          RIVO_QA_DIR: ${{ runner.temp }}/rivo-04576-browser-qa
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/rivo-preview.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          # Built preview verifies final layout; Vite development port additionally
          # exposes source modules for real PDF viewer click-handler tests.
          npm run dev -- --host 127.0.0.1 --port 4174 > "$RUNNER_TEMP/rivo-dev.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-responsive-04576.mjs
          RIVO_URL=http://127.0.0.1:4174 node scripts/qa-04581-icons-documents.mjs
          RIVO_URL=http://127.0.0.1:4174 node scripts/qa-04588-fab-banner.mjs
          RIVO_URL=http://127.0.0.1:4174 node scripts/qa-04590-surface.mjs
      - name: Upload responsive browser screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-0.45.96-Browser-UI-320-to-768-and-Landscape
          path: ${{ runner.temp }}/rivo-04576-browser-qa/
          if-no-files-found: warn
          retention-days: 30
      - name: Create Android project and sync plugins
        run: |
          python3 scripts/patch-rivoscan-native-banner-host.py
          npx cap add android
          npx cap sync android
          python3 scripts/prepare-rivoscan-compact.py
          python3 scripts/configure-rivoscan-maven-mirror.py
          python3 scripts/verify-rivoscan-portrait.py
          node scripts/prepare-rivoscan-admob-release.mjs
      - name: Cache verified Gradle dependencies and reduce Maven Central requests
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Sign with original Google Play upload key
        env:
          RIVO_UPLOAD_KEYSTORE_BASE64: ${{ secrets.RIVO_CORRECT_KEYSTORE_BASE64 }}
          RIVO_UPLOAD_STORE_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
          RIVO_UPLOAD_KEY_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
        run: python3 scripts/prepare-rivoscan-signing.py
      - name: Configure ABI splits without changing app features
        run: python3 scripts/configure-rivoscan-abi-splits.py
      - name: Assemble all signed ABI-specific APKs plus universal - NEVER upload to Play
        env:
          RIVO_UPLOAD_STORE_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
          RIVO_UPLOAD_KEY_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          sed -i 's/-all[.]zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          ./gradlew assembleRelease --no-daemon --max-workers=2
      - name: Compare every feature, model, and shared class across all five APKs
        run: |
          set -euo pipefail
          python3 scripts/verify-rivoscan-abi-content.py
      - name: Verify all five APK versions, portrait manifests and original signing key
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          OUTPUT=android/app/build/outputs/apk/release
          for ABI in universal arm64-v8a armeabi-v7a x86 x86_64; do
            APK="$OUTPUT/app-$ABI-release.apk"
            test -s "$APK"
            "$AAPT" dump badging "$APK" | grep -F "name='com.ribhlab.rivoscan' versionCode='211' versionName='0.45.96'"
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -E 'android:screenOrientation.*0x1([[:space:]]|$)'
            "$APKSIGNER" verify --verbose "$APK"
            "$APKSIGNER" verify --print-certs "$APK" | grep -Fi 'e9b3e2779575ba08a91372fc3885eba01dd3e73e'
            ls -lh "$APK"
          done
          echo 'Five architecture-compatible RivoScan packages signed with original key. Same DEX, all ML Kit model data and same-ABI libraries. No Play upload.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build signed all-architecture Android App Bundle for Google Play
        env:
          RIVO_UPLOAD_STORE_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
          RIVO_UPLOAD_KEY_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew bundleRelease --no-daemon --max-workers=2
      - name: Verify the AAB has all ABIs, unchanged models and original signing
        run: |
          set -euo pipefail
          python3 scripts/verify-rivoscan-aab-parity.py
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | grep -F 'jar verified'
          keytool -printcert -jarfile "$AAB" | grep -Fi 'E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E'
          echo 'Play-compatible signed AAB verified. Do not upload to Play without a publishing request.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save signed device-optimized Google Play AAB for future publication
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-0.45.96-ALL-SUPPORTED-ANDROID-GOOGLE-PLAY-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Save signed ARM64/ARM32/x86/x86_64/Universal APKs as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-0.45.96-LOSSLESS-All-ABI-APKs
          path: |
            android/app/build/outputs/apk/release/app-*-release.apk
            android/app/build/outputs/apk/release/rivoscan-abi-content-verification.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish signed lossless device-specific APKs on GitHub, not Google Play
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=rivoscan-0.45.96-contained-banner
          OUTPUT=android/app/build/outputs/apk/release
          cp "$OUTPUT/app-arm64-v8a-release.apk" /tmp/RivoScan-0.45.96-ARM64-SIGNED.apk
          cp "$OUTPUT/app-armeabi-v7a-release.apk" /tmp/RivoScan-0.45.96-ARM32-SIGNED.apk
          cp "$OUTPUT/app-universal-release.apk" /tmp/RivoScan-0.45.96-UNIVERSAL-SIGNED.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Signed release exists, leaving it unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" \
              /tmp/RivoScan-0.45.96-ARM64-SIGNED.apk \
              /tmp/RivoScan-0.45.96-ARM32-SIGNED.apk \
              /tmp/RivoScan-0.45.96-UNIVERSAL-SIGNED.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'RivoScan 0.45.96 - Correct AdMob Banner ID' \
               --notes 'Native banner containment: real fixed 320x50 host aligned to WebView, no duplicate Android insets. Original AdMob IDs and signing preserved.'
          fi
          # Keep the original APKs; attach the verified AAB for Play per-device delivery.
          cp android/app/build/outputs/bundle/release/app-release.aab /tmp/RivoScan-0.45.96-ALL-SUPPORTED-ANDROID-PLAY.aab
          gh release upload "$TAG" /tmp/RivoScan-0.45.96-ALL-SUPPORTED-ANDROID-PLAY.aab --repo "$GITHUB_REPOSITORY" --clobber

      - name: Check signed candidate assets exist (native demo QA is separate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view rivoscan-0.45.96-contained-banner --repo "$GITHUB_REPOSITORY" >/dev/null; then
            echo 'Signed candidate staged on GitHub only. Native test banner QA must pass before Play publication.' >> "$GITHUB_STEP_SUMMARY"
          else
            exit 1
          fi
