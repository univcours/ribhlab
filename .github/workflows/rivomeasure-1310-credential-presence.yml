name: RivoMeasure code14 - secret availability and GitHub write safety probe
on:
  push:
    branches: [release/rivomeasure-1310-admob-safe-20261127]
    paths: [.github/workflows/rivomeasure-1310-credential-presence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      KEY_B64: ${{ secrets.RIVO_CORRECT_KEYSTORE_BASE64 }}
      KEY_PASS: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Output only presence booleans, never secret material
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PLAY_JSON:-}" ]]; then echo 'SOURCE_REPO_PLAY_SERVICE_ACCOUNT=PRESENT'; else echo 'SOURCE_REPO_PLAY_SERVICE_ACCOUNT=ABSENT'; fi
          if [[ -n "${KEY_B64:-}" && -n "${KEY_PASS:-}" ]]; then echo 'SOURCE_REPO_ORIGINAL_KEY=PRESENT'; else echo 'SOURCE_REPO_ORIGINAL_KEY=ABSENT'; fi
          gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions' | python3 -c 'import json,sys; x=json.load(sys.stdin); print("GITHUB_ACTIONS_TOKEN_SOURCE_WRITE="+str(bool(x.get("push"))))'
