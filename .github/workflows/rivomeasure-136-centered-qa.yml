name: RivoMeasure 1.3.6 centered room pose QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rivomeasure-136-centered-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  calibrated-room:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RivoMeasure-v1.3.6-RivoScan-key-SIGNED-TEST-ADS
          path: signed-artifacts
          run-id: 45854060420
          github-token: ${{ github.token }}
      - name: Install camera runtime and QA dependencies
        run: |
          curl -fL --retry 3 https://github.com/google-ar/arcore-android-sdk/releases/download/1.57.0/Google_Play_Services_for_AR_1.57.0_x86_for_emulator.apk -o arcore-emulator.apk
          python3 -m pip install grpcio pillow
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Scan an independently calibrated room with the unmodified signed app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          emulator-build: 13610412
          cores: 4
          ram-size: 3072M
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          pre-emulator-launch-script: python3 qa/ribhmeasure/calibrated_room.py --resources "$ANDROID_HOME/emulator/resources" --truth qa-output/ground-truth.json
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back virtualscene -camera-front emulated -grpc 8554
          script: python3 qa/ribhmeasure/room_pose_sweep.py
      - name: Independent comparison with reference dimensions
        if: always()
        run: python3 qa/ribhmeasure/compare_calibrated_room.py
      - name: Preserve all ground truth, real screen images and measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoMeasure-136-centered-room-evidence
          path: qa-output/
          if-no-files-found: warn
