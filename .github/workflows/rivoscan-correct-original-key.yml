name: RivoScan 0.45.17 correct original upload key
# Final release job: signed artifacts built from the branch after 161/161 responsive checks.
on:
  workflow_dispatch:
  push:
    branches: [rivoscan-standalone-ready]
    paths:
      - '.github/workflows/rivoscan-correct-original-key.yml'
      - 'rivoscan-version.properties'
      - 'package.json'
permissions:
  contents: read
concurrency:
  group: rivoscan-original-key-${{ github.ref }}
  cancel-in-progress: false
jobs:
  play-aab:
    name: Original-key signed AAB, requires Google Play SHA1 match
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RIVO_COMPACT_BUILD: '1'
      VITE_RIVO_COMPACT: '1'
      VITE_RIVO_ADMOB_MODE: live
      VITE_RIVO_ADMOB_APP_ID: ca-app-pub-7945572016731367~1509328607
      VITE_RIVO_ADMOB_BANNER_ID: ca-app-pub-7945572016731367/4841809190
      VITE_RIVO_ADMOB_INTERSTITIAL_ID: ca-app-pub-7945572016731367/5608742752
      VITE_RIVO_ADMOB_REWARDED_ID: ca-app-pub-7945572016731367/4148993879
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rivoscan-standalone-ready
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reject missing real AdMob IDs
        run: node scripts/prepare-rivoscan-admob-release.mjs --check-only
      - name: Install dependencies, run all tests, bundle production ad settings
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - name: Generate native Android wrapper
        run: |
          npx cap add android
          npx cap sync android
      - name: Prepare compact native Google ML Kit + PerfectClean build
        run: |
          python3 scripts/prepare-rivoscan-compact.py
          test ! -e android/app/src/main/assets/uvdoc/inference.onnx
          ! grep -q 'onnxruntime-android' android/app/build.gradle
          ! grep -q 'org.opencv:opencv' android/app/build.gradle
      - name: Set production AdMob Android application ID
        run: node scripts/prepare-rivoscan-admob-release.mjs
      - name: Configure release signing without committing the private key
        env:
          RIVO_UPLOAD_KEYSTORE_BASE64: ${{ secrets.RIVO_CORRECT_KEYSTORE_BASE64 }}
          RIVO_UPLOAD_STORE_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
          RIVO_UPLOAD_KEY_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
        run: python3 scripts/prepare-rivoscan-signing.py
      - name: Require Google Play registered original upload certificate SHA1
        env:
          RIVO_UPLOAD_STORE_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if ! CERT_INFO="$(keytool -list -v -keystore "$RIVO_SIGNING_KEYSTORE_PATH" -storetype PKCS12 -storepass:env RIVO_UPLOAD_STORE_PASSWORD -alias "${RIVO_UPLOAD_KEY_ALIAS:-key0}" 2>&1)"; then
            echo "::error::Cannot open the supplied RivoScan keystore using the configured password and alias key0. Verify RIVO_CORRECT_KEY_PASSWORD matches the key file; no bundle built."
            exit 1
          fi
          ACTUAL_SHA1="$(echo "$CERT_INFO" | awk '$1 == "SHA1:" {print $2; exit}')"
          test -n "$ACTUAL_SHA1" || { echo "::error::Valid keystore, but signing certificate SHA1 could not be parsed"; exit 1; }
          echo "Actual keystore certificate SHA1: $ACTUAL_SHA1" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ACTUAL_SHA1" != "E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E" ]; then
            echo "::error::WRONG RivoScan upload certificate SHA1: $ACTUAL_SHA1. Expected E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E. No AAB will be built."
            exit 1
          fi
          echo "Matched existing Google Play upload certificate SHA-1." >> "$GITHUB_STEP_SUMMARY"
      - name: Set Google Play versionCode 121 and versionName 0.45.17
        run: |
          set -euo pipefail
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 121/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "0.45.17"/' android/app/build.gradle
          grep -Eq 'versionCode[[:space:]]+121' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"0[.]45[.]17"' android/app/build.gradle
      - name: Assemble signed release app bundle
        env:
          RIVO_UPLOAD_STORE_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
          RIVO_UPLOAD_KEY_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          sed -i 's/-all[.]zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Verify bundle signature and package contents
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -Z -1 "$AAB" | grep -Fx 'base/manifest/AndroidManifest.xml'
          jarsigner -verify "$AAB" > /tmp/rivo-verify.txt 2>&1
          grep -q 'jar verified' /tmp/rivo-verify.txt
          keytool -printcert -jarfile "$AAB" | grep -F 'SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E' >/dev/null
          echo "RivoScan 0.45.17 / versionCode 121: signed release AAB verified" >> "$GITHUB_STEP_SUMMARY"
          echo "AAB size: $(stat -c%s "$AAB") bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify installable release APK signature and version
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/rivoscan-apk-certs.txt
          grep -iq 'e9b3e2779575ba08a91372fc3885eba01dd3e73e' /tmp/rivoscan-apk-certs.txt
          AAPT="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "name='com.ribhlab.rivoscan' versionCode='121' versionName='0.45.17'"
          echo "RivoScan 0.45.17 APK: original Google Play upload key verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve Play upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-0.45.17-signed-ORIGINAL-GooglePlay-Key-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Preserve installable APK signed by original key
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-0.45.17-ORIGINAL-Key-signed-installable-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
