name: Mazamir Daoud 5 v1.0.1 - verified RivoScan original key + More Apps
on:
  push:
    branches:
      - build/mazamirdaoud5-original-rivo-sign-20261122
    paths:
      - .github/workflows/mazamirdaoud5-original-rivo-sign.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Mazamir Daoud 5 original website
        uses: actions/checkout@v4
        with:
          repository: univcours/mazamirdaoud5
          ref: 9c33c8ce2a247f9277347dccd9acd8e4457b4260
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify approved Google Play More Apps links without Ad SDKs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source/index.html').read_text()
          assert 'id="ribhMoreAppsSection"' in s and 'id="ribhMoreAppsToggle"' in s
          assert '<details class="ribh-more-apps"' in s
          for package in ['com.ribhlab.rivoscan','com.ribhlab.tradingfiew','com.novagrid.cosmicpuzzle']:
              assert 'https://play.google.com/store/apps/details?id='+package in s
          assert 'googleads.g.doubleclick.net' not in s
          print('Three user-initiated More Apps links verified. No forced ad display.')
          PY
      - name: Prepare Capacitor Android wrapper preserving Mazamir branding
        shell: bash
        run: |
          set -euo pipefail
          test -s source/index.html
          mkdir -p mazamir/www
          cp source/index.html mazamir/www/index.html
          cd mazamir
          cat > package.json <<'PKG'
          {
            "name": "mazamirdaoud5-android",
            "version": "1.0.1",
            "private": true,
            "description": "Mazamir Daoud 5 Android release",
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0",
              "@capacitor/app": "^8.0.0",
              "@capacitor/geolocation": "^8.0.0",
              "@capacitor/local-notifications": "^8.0.0",
              "@capacitor/share": "^8.0.0",
              "@capacitor/browser": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          PKG
          cat > capacitor.config.json <<'CFG'
          {
            "appId": "com.ribhlab.mazamirdaoud",
            "appName": "مزامير داود",
            "webDir": "www",
            "server": {"androidScheme": "https"}
          }
          CFG
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Configure Android app permissions and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('mazamir/android/app')
          manifest=root/'src/main/AndroidManifest.xml'
          s=manifest.read_text()
          for permission in ['android.permission.INTERNET',
                             'android.permission.ACCESS_COARSE_LOCATION',
                             'android.permission.ACCESS_FINE_LOCATION',
                             'android.permission.POST_NOTIFICATIONS']:
              tag=f'<uses-permission android:name="{permission}" />'
              if tag not in s:
                  s=s.replace('<application', f'    {tag}\n    <application', 1)
          manifest.write_text(s)
          gradle=root/'build.gradle'
          g=gradle.read_text()
          g=g.replace('versionName "1.0"', 'versionName "1.0.1"')
          g=g.replace('versionCode 1', 'versionCode 2')
          gradle.write_text(g)
          assert 'com.ribhlab.mazamirdaoud' in g
          assert 'versionCode 2' in g
          assert 'versionName "1.0.1"' in g
          print('Package=com.ribhlab.mazamirdaoud, versionCode=2, versionName=1.0.1')
          PY
      - name: Load and validate RivoScan ORIGINAL signing key
        shell: bash
        env:
          KEY_B64: ${{ secrets.RIVO_CORRECT_KEYSTORE_BASE64 }}
          SIGN_PASS: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" || { echo '::error::Original RivoScan keystore secret missing'; exit 1; }
          test -n "$SIGN_PASS" || { echo '::error::Original RivoScan password secret missing'; exit 1; }
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/mazamir-rivo-original.p12"
          chmod 600 "$RUNNER_TEMP/mazamir-rivo-original.p12"
          keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/mazamir-rivo-original.p12" -storepass:env SIGN_PASS > "$RUNNER_TEMP/mazamir-cert.txt"
          SHA1="$(sed -nE 's/^[[:space:]]*SHA1: ([A-F0-9:]+)[[:space:]]*$/\1/p' "$RUNNER_TEMP/mazamir-cert.txt" | head -n1)"
          ALIAS="$(sed -nE 's/^Alias name: (.+)$/\1/p' "$RUNNER_TEMP/mazamir-cert.txt" | head -n1)"
          test "$SHA1" = 'E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E' || { echo '::error::RivoScan certificate mismatch; refused to sign'; exit 1; }
          test -n "$ALIAS" || { echo '::error::Cannot identify the keystore alias'; exit 1; }
          echo "RIVO_KEY_FILE=$RUNNER_TEMP/mazamir-rivo-original.p12" >> "$GITHUB_ENV"
          echo "RIVO_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo 'Verified original RivoScan Play upload certificate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure release signing without storing any password in source
        shell: bash
        run: |
          cat >> mazamir/android/app/build.gradle <<'GROOVY'
          android {
              signingConfigs {
                  rivoOriginal {
                      storeFile file(System.getenv('RIVO_KEY_FILE'))
                      storePassword System.getenv('RIVO_SIGN_PASS')
                      keyAlias System.getenv('RIVO_KEY_ALIAS')
                      keyPassword System.getenv('RIVO_SIGN_PASS')
                      storeType 'PKCS12'
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.rivoOriginal }
              }
          }
          GROOVY
      - name: Compile signed Android Play AAB and installer APK
        shell: bash
        env:
          RIVO_SIGN_PASS: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd mazamir/android
          chmod +x gradlew
          sed -i 's/-all[.]zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease
      - name: Verify signature, package identity and Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          AAB=mazamir/android/app/build/outputs/bundle/release/app-release.aab
          APK=mazamir/android/app/build/outputs/apk/release/app-release.apk
          test -s "$AAB"
          test -s "$APK"
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/mazamir-verify.txt" 2>&1
          grep -q 'jar verified' "$RUNNER_TEMP/mazamir-verify.txt"
          keytool -printcert -jarfile "$AAB" | grep -F 'SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -Fi 'e9b3e2779575ba08a91372fc3885eba01dd3e73e'
          "$AAPT" dump badging "$APK" | grep -F "name='com.ribhlab.mazamirdaoud' versionCode='2' versionName='1.0.1'"
          echo 'Mazamir Daoud 5 v1.0.1: verified RivoScan-key-signed APK and AAB with More Apps menu.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified signed Android builds (no Play publication yet)
        uses: actions/upload-artifact@v4
        with:
          name: Mazamir-Daoud5-v1.0.1-RivoScan-Original-Key-MoreApps-SIGNED
          path: |
            mazamir/android/app/build/outputs/bundle/release/app-release.aab
            mazamir/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary original signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mazamir-rivo-original.p12" "$RUNNER_TEMP/mazamir-cert.txt"
