name: RivoCaption 0.3.5 original RivoScan QA signing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rivocaption-035-sign-unsigned.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ZIP_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-5bc0-8246-b2c9-5ae6ddee002e/raw?se=2026-11-26T12%3A16%3A43Z&sp=r&sv=2026-06-06&sr=b&scid=7f407e60-b746-5ecc-8959-34d9881678ec&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-26T06%3A40%3A19Z&ske=2026-11-27T06%3A40%3A19Z&sks=b&skv=2026-06-06&sig=T6o1NwTHLU%2BsmpqxTlUszkosybKGlLd0hb3gVK/qdDY%3D'
      EXPECTED_ZIP_SHA256: '41ef1c77abe51c420465673be41fa105569044ca1fbb2bd85143f5b62f469f51'
      ORIGINAL_SHA1: 'E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E'
      RIVO_KEY_B64: ${{ secrets.RIVO_CORRECT_KEYSTORE_BASE64 }}
      RIVO_KEY_PASS: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore original signing key and confirm certificate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RIVO_KEY_B64" && test -n "$RIVO_KEY_PASS"
          umask 077
          printf '%s' "$RIVO_KEY_B64" | base64 -d > "$RUNNER_TEMP/rivoscan-original.p12"
          CERT="$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/rivoscan-original.p12" -storepass:env RIVO_KEY_PASS -alias key0)"
          ACTUAL="$(printf '%s\n' "$CERT" | awk '$1=="SHA1:" {print $2;exit}')"
          test "$ACTUAL" = "$ORIGINAL_SHA1"
          echo 'Original RivoScan signing SHA1 verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Download private-repo unsigned release binaries
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --connect-timeout 25 "$ZIP_URL" -o "$RUNNER_TEMP/rivocaption-unsigned.zip"
          echo "$EXPECTED_ZIP_SHA256  $RUNNER_TEMP/rivocaption-unsigned.zip" | sha256sum -c -
          mkdir -p in out
          unzip -q "$RUNNER_TEMP/rivocaption-unsigned.zip" -d in
          find in -maxdepth 2 -type f -printf '%p %s bytes\n'
          test -s in/RivoCaption-0.3.5-UNSIGNED.aab
          test -s in/RivoCaption-0.3.5-UNSIGNED.apk
          (cd in && sha256sum -c UNSIGNED-SHA256SUMS.txt)
      - name: Prepare Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -r | head -n1)"
          "$SDKMANAGER" --install 'build-tools;36.0.0'
      - name: Sign release AAB and APK with original certificate
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          "$TOOLS/zipalign" -P 16 -f 4 in/RivoCaption-0.3.5-UNSIGNED.apk "$RUNNER_TEMP/rc-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/rivoscan-original.p12" --ks-type PKCS12 --ks-key-alias key0 --ks-pass env:RIVO_KEY_PASS --key-pass env:RIVO_KEY_PASS --out out/RivoCaption-0.3.5-RivoScan-SIGNED.apk "$RUNNER_TEMP/rc-aligned.apk"
          cp in/RivoCaption-0.3.5-UNSIGNED.aab out/RivoCaption-0.3.5-RivoScan-SIGNED.aab
          jarsigner -keystore "$RUNNER_TEMP/rivoscan-original.p12" -storetype PKCS12 -storepass:env RIVO_KEY_PASS -keypass:env RIVO_KEY_PASS -sigalg SHA256withRSA -digestalg SHA-256 out/RivoCaption-0.3.5-RivoScan-SIGNED.aab key0
          "$TOOLS/aapt" dump badging out/RivoCaption-0.3.5-RivoScan-SIGNED.apk | grep -F "package: name='com.rivocaption.editor' versionCode='9' versionName='0.3.5'"
          "$TOOLS/apksigner" verify --verbose --print-certs out/RivoCaption-0.3.5-RivoScan-SIGNED.apk > "$RUNNER_TEMP/verify-apk.txt"
          grep -iq 'e9b3e2779575ba08a91372fc3885eba01dd3e73e' "$RUNNER_TEMP/verify-apk.txt"
          jarsigner -verify out/RivoCaption-0.3.5-RivoScan-SIGNED.aab > "$RUNNER_TEMP/verify-aab.txt" 2>&1
          grep -Fq 'jar verified' "$RUNNER_TEMP/verify-aab.txt"
          keytool -printcert -jarfile out/RivoCaption-0.3.5-RivoScan-SIGNED.aab | grep -F "SHA1: $ORIGINAL_SHA1"
          (cd out && sha256sum *.apk *.aab > SHA256SUMS.txt)
          echo 'Original-key signed verified RivoCaption APK and AAB; still requires Play Console upload and review.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: RivoCaption-0.3.5-Original-RivoScan-SIGNED
          path: out/
          if-no-files-found: error
          retention-days: 14
      - name: Publish binary-only signed prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rivocaption-v0.3.5-original-rivoscan-qa
          name: RivoCaption 0.3.5 signed Android release
          prerelease: true
          body: 'RivoCaption 0.3.5 QA-only Android APK/AAB (code 9). Signed with verified original RivoScan key. Device ASR/UI/export QA and Play publishing remain separate.'
          files: |
            out/RivoCaption-0.3.5-RivoScan-SIGNED.apk
            out/RivoCaption-0.3.5-RivoScan-SIGNED.aab
            out/SHA256SUMS.txt
      - name: Remove temporary private signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/rivoscan-original.p12"
