name: RivoMeasure signed AR compatibility matrix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rivomeasure-135-ar-compatibility.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ar:
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RivoMeasure-v1.3.5-RivoScan-key-SIGNED-TEST-ADS
          path: signed-artifacts
          run-id: 45833597739
          github-token: ${{ github.token }}
      - name: Download official emulator ARCore
        run: |
          curl -fL --retry 3 https://github.com/google-ar/arcore-android-sdk/releases/download/1.57.0/Google_Play_Services_for_AR_1.57.0_x86_for_emulator.apk -o arcore-emulator.apk
          python3 -m pip install grpcio
          python3 -m py_compile qa/ribhmeasure/virtual_scene.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test signed APK with virtual camera
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back virtualscene -grpc 8554
          script: python3 qa/ribhmeasure/virtual_scene.py
      - name: Preserve real diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoMeasure-135-AR-api-${{ matrix.api }}
          path: qa-output/
          if-no-files-found: warn
