name: RivoScan 0.45.43 signed original key APK AAB
on:
  push:
    branches: [rivoscan-standalone-ready]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'rivoscan-version.properties'
      - 'package.json'
      - '.github/workflows/rivoscan-04541-original-key.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rivoscan-04541-original-key-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RIVO_COMPACT_BUILD: '1'
      VITE_RIVO_COMPACT: '1'
      VITE_RIVO_ADMOB_MODE: live
      VITE_RIVO_ADMOB_APP_ID: ca-app-pub-7945572016731367~1509328607
      VITE_RIVO_ADMOB_BANNER_ID: ca-app-pub-7945572016731367/4841809190
      VITE_RIVO_ADMOB_INTERSTITIAL_ID: ca-app-pub-7945572016731367/5608742752
      VITE_RIVO_ADMOB_APP_OPEN_ID: ca-app-pub-7945572016731367/6270875707
      VITE_RIVO_ADMOB_REWARDED_ID: ca-app-pub-7945572016731367/4148993879
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check version and live ad identifiers
        run: |
          set -euo pipefail
          grep -Fx 'versionCode=147' rivoscan-version.properties
          grep -Fx 'versionName=0.45.43' rivoscan-version.properties
          node scripts/prepare-rivoscan-admob-release.mjs --check-only
      - name: Install, verify source, run tests, bundle assets
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - name: Generate native Capacitor project
        run: |
          npx cap add android
          npx cap sync android
      - name: Prepare Android ML Kit compatible compact release
        run: |
          python3 scripts/prepare-rivoscan-compact.py
          test ! -e android/app/src/main/assets/uvdoc/inference.onnx
      - name: Activate real AdMob application ID in Android manifest
        run: node scripts/prepare-rivoscan-admob-release.mjs
      - name: Configure Play original upload key securely
        env:
          RIVO_UPLOAD_KEYSTORE_BASE64: ${{ secrets.RIVO_CORRECT_KEYSTORE_BASE64 }}
          RIVO_UPLOAD_STORE_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
          RIVO_UPLOAD_KEY_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
        run: python3 scripts/prepare-rivoscan-signing.py
      - name: Build release APK and AAB (both signed)
        env:
          RIVO_UPLOAD_STORE_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
          RIVO_UPLOAD_KEY_PASSWORD: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          sed -i 's/-all[.]zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Verify app identity and original Play signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep -F "name='com.ribhlab.rivoscan' versionCode='147' versionName='0.45.43'"
          "$APKSIGNER" verify "$APK"
          jarsigner -verify "$AAB" | grep -F 'jar verified'
          keytool -printcert -jarfile "$AAB" | grep -Fi 'SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E'
          echo 'Signed RivoScan 0.45.43 (147) APK and AAB match original Google Play upload certificate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed Android APK (original key)
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-0.45.43-OriginalKey-SIGNED-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      - name: Upload signed Google Play AAB (original key)
        uses: actions/upload-artifact@v4
        with:
          name: RivoScan-0.45.43-OriginalKey-SIGNED-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Publish signed APK and AAB to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=rivoscan-0.45.43-original-key
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Refusing to overwrite signed version. Bump version instead."
            exit 1
          fi
          cp "$APK" /tmp/RivoScan-0.45.43-Signed.apk
          cp "$AAB" /tmp/RivoScan-0.45.43-GooglePlay.aab
          gh release create "$TAG" /tmp/RivoScan-0.45.43-Signed.apk /tmp/RivoScan-0.45.43-GooglePlay.aab \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'RivoScan 0.45.43 - PerfectScan UX and Blue Controls' \
            --notes 'Signed with the original Google Play upload key. PerfectScan shows enhanced photo unobstructed; Compare is optional. Clear contextual settings, readable buttons, and quality status. Android versionCode 147. The AAB is ready for Google Play Console upload; this GitHub release does not itself deploy to Play Store.'
          echo 'Published original-key signed APK and AAB to GitHub Releases.' >> "$GITHUB_STEP_SUMMARY"
