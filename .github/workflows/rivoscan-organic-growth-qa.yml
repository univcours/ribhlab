name: RivoScan organic growth QA
on:
  push:
    branches: [feature/rivoscan-organic-growth]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RIVO_COMPACT_BUILD: '1'
      VITE_RIVO_COMPACT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - name: Native build compilation (debug QA only, no publication)
        run: |
          python3 scripts/patch-rivoscan-native-banner-host.py
          npx cap add android
          npx cap sync android
          python3 scripts/prepare-rivoscan-compact.py
          python3 scripts/configure-rivoscan-maven-mirror.py
          python3 scripts/verify-rivoscan-portrait.py
          cd android
          chmod +x gradlew
          sed -i 's/-all[.]zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --max-workers=2
