name: RivoCaption code19 - verify unsigned AAB chunks and sign with original key
on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Exact approved RivoCaption source commit SHA
        required: true
        type: string
      expected_unsigned_sha256:
        description: Exact SHA256 of local unsigned AAB code19
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: rivocaption-045-original-key-signer
  cancel-in-progress: false
jobs:
  verify-and-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      EXPECTED_AAB_SHA256: ${{ inputs.expected_unsigned_sha256 }}
      GH_TOKEN: ${{ github.token }}
      RIVO_KEY_B64: ${{ secrets.RIVO_CORRECT_KEYSTORE_BASE64 }}
      RIVO_KEY_PASS: ${{ secrets.RIVO_CORRECT_KEY_PASSWORD }}
      ORIGINAL_SHA1: E9:B3:E2:77:95:75:BA:08:A9:13:72:FC:38:85:EB:A0:1D:D3:E7:3E
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Download exact unsigned RivoCaption code19 transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "$EXPECTED_AAB_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          mkdir -p transfer signed
          gh release download rivocaption-v0.4.5-code19-chunked-unsigned-transfer \
            --repo univcours/ribhlab --dir transfer
      - name: Verify manifest, every chunk checksum, and exact code19 AAB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          root=Path("transfer")
          manifest=json.loads((root/"MANIFEST.json").read_text())
          assert manifest["applicationId"]=="com.rivocaption.editor"
          assert manifest["versionCode"]==19
          assert manifest["versionName"]=="0.4.5"
          assert manifest["sourceCommit"]==os.environ["SOURCE_COMMIT"]
          assert manifest["unsignedAabSha256"]==os.environ["EXPECTED_AAB_SHA256"].lower()
          parts=manifest["parts"]
          assert len(parts)==14
          output=Path("signed")/"RivoCaption-0.4.5-UNSIGNED.aab"
          with output.open("wb") as dst:
              for i,entry in enumerate(parts):
                  name=f"RivoCaption-0.4.5-UNSIGNED.aab.part{i:03}"
                  assert entry["name"]==name
                  p=root/name
                  data=p.read_bytes()
                  assert len(data)==entry["bytes"]
                  assert hashlib.sha256(data).hexdigest()==entry["sha256"]
                  dst.write(data)
          assert output.stat().st_size==manifest["unsignedAabBytes"]==58397013
          assert hashlib.sha256(output.read_bytes()).hexdigest()==manifest["unsignedAabSha256"]
          print("LATEST_LOCAL_RIVOCAPTION_SOURCE_CODE19_EXACT_AAB_VERIFIED=TRUE")
          PY
          unzip -t signed/RivoCaption-0.4.5-UNSIGNED.aab | tail -n 2
          unzip -Z -1 signed/RivoCaption-0.4.5-UNSIGNED.aab | grep -Fx 'base/manifest/AndroidManifest.xml'
          printf 'SOURCE_COMMIT=%s\nVERSION_NAME=0.4.5\nVERSION_CODE=19\nPACKAGE=com.rivocaption.editor\nUNSIGNED_AAB_SHA256=%s\n' \
            "$SOURCE_COMMIT" "$EXPECTED_AAB_SHA256" > signed/SOURCE-IDENTITY.txt
      - name: Restore original RivoCaption upload key and verify certificate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RIVO_KEY_B64" && test -n "$RIVO_KEY_PASS"
          umask 077
          printf '%s' "$RIVO_KEY_B64" | base64 --decode > "$RUNNER_TEMP/rivocaption-original.p12"
          CERT="$(keytool -list -v -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/rivocaption-original.p12" \
            -storepass:env RIVO_KEY_PASS -alias key0)"
          ACTUAL="$(printf '%s\n' "$CERT" | awk '$1=="SHA1:"{print $2;exit}')"
          test "$ACTUAL" = "$ORIGINAL_SHA1"
          echo "RIVOCAPTION_ORIGINAL_UPLOAD_CERTIFICATE_VERIFIED=TRUE" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign and verify latest code19 RivoCaption AAB
        shell: bash
        run: |
          set -euo pipefail
          cp signed/RivoCaption-0.4.5-UNSIGNED.aab signed/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab
          jarsigner -keystore "$RUNNER_TEMP/rivocaption-original.p12" \
            -storetype PKCS12 -storepass:env RIVO_KEY_PASS -keypass:env RIVO_KEY_PASS \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            signed/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab key0
          jarsigner -verify signed/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab > "$RUNNER_TEMP/verify.txt" 2>&1
          grep -Fq 'jar verified' "$RUNNER_TEMP/verify.txt"
          keytool -printcert -jarfile signed/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab \
            | grep -F "SHA1: $ORIGINAL_SHA1"
          (cd signed && sha256sum RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab > SHA256SUMS.txt)
          rm -f signed/RivoCaption-0.4.5-UNSIGNED.aab
          echo 'RIVOCAPTION_CODE19_ORIGINAL_KEY_SIGNED=TRUE' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish signed RivoCaption Play candidate without uploading to Play
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rivocaption-v0.4.5-original-key-aab
          name: RivoCaption 0.4.5 (19) original-key verified Google Play AAB
          prerelease: true
          fail_on_unmatched_files: true
          body: Exact local code19 AAB reconstructed from verified chunk SHA256s and original-key signed. This is NOT proof of Google Play publication.
          files: |
            signed/RivoCaption-0.4.5-ORIGINAL-KEY-SIGNED.aab
            signed/SHA256SUMS.txt
            signed/SOURCE-IDENTITY.txt
      - name: Erase ephemeral private key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rivocaption-original.p12"
